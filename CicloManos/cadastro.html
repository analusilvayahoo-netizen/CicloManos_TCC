<style>

.form-container{
  max-width: 850px;

  background: white;

}

.form-container h1{
  text-align: center;

fieldset{

}

legend{
  color: #4A86B8;
  font-weight: bold;

}

label{

  color: #333;
  font-weight: bold;
}

input[type="text"]{
  width: 100%;
  padding: 12px;
  margin-top: 5px;
  border: 1px solid #ccc;
  border-radius: 8px;
  font-size: 14px;
  transition: 0.3s;
}

input[type="text"]:focus{
  outline: none;
  border-color: #4A86B8;
  box-shadow: 0 0 8px rgba(74,134,184,0.3);
}

.botoes{
  display: flex;
  justify-content: center;
  gap: 15px;
  margin-top: 20px;
}

input[type="submit"],
input[type="reset"]{
  padding: 12px 25px;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  font-weight: bold;
  color: white;
  transition: 0.3s;
}

input[type="submit"]{
  background: #4A86B8;
}

input[type="submit"]:hover{
  background: #3a709c;
}

input[type="reset"]{
  background: #e60023;
}

input[type="reset"]:hover{
  background: #c4001d;
}
